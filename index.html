<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars Vendas - Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #ee4d2d;
            padding: 20px;
            text-align: center;
        }

        .logo-title {
            font-size: 2rem;
            font-weight: 800;
            color: #ee4d2d;
            text-shadow: 0 0 15px rgba(238, 77, 45, 0.4);
            text-decoration: none;
        }

        .logo-title span { color: #fff; }

        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 800;
        }

        h1 span { color: #ee4d2d; }

        p {
            font-size: 1.2rem;
            color: #a9b7c6;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .buttons-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-enter {
            display: inline-block;
            color: #fff;
            text-decoration: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-shopee {
            background: #ee4d2d;
            box-shadow: 0 5px 20px rgba(238, 77, 45, 0.4);
        }

        .btn-shopee:hover {
            background: #ff6533;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(238, 77, 45, 0.6);
        }

        .btn-ml {
            background: #fff159;
            color: #333;
            box-shadow: 0 5px 20px rgba(255, 241, 89, 0.2);
        }

        .btn-ml:hover {
            background: #fff58f;
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 241, 89, 0.4);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 0.9rem;
            border-top: 1px solid #1f2833;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-title">STARS <span>VENDAS</span> 🌟</a>
    </header>

    <div class="hero-container">
        <h1>Os Melhores Achadinhos da Internet</h1>
        <p>Bem-vindo ao Stars Vendas! Escolha abaixo qual vitrine de ofertas você quer navegar para encontrar os melhores produtos com descontos exclusivos.</p>
        
        <div class="buttons-group">
            <a href="segunda.html" class="btn-enter btn-shopee">Ofertas da Shopee 🛍️</a>
            <a href="terceira.html" class="btn-enter btn-ml">Ofertas do Mercado Livre 📦</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Stars Vendas. Todos os direitos reservados.
    </footer>

</body>
</html>
